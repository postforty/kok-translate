<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title data-i18n="optionsTitle">KokTranslate 설정</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 25px 20px; max-width: 440px; margin: 0 auto; color: #333; line-height: 1.5; }
    h1 { color: #8A2BE2; font-size: 22px; display: flex; align-items: center; gap: 8px; margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #8A2BE2; padding-bottom: 8px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #333; }
    
    .input-group { display: flex; }
    .input-group input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-right: none;
      border-radius: 5px 0 0 5px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .input-group input:focus {
      outline: none;
      border-color: #8A2BE2;
      box-shadow: 0 0 0 2px rgba(138, 43, 226, 0.2);
    }
    .input-group button {
      padding: 0 12px;
      background: #f8f9fa;
      color: #555;
      border: 1px solid #ccc;
      border-radius: 0 5px 5px 0;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, color 0.2s;
    }
    .input-group button:hover {
      background: #e9ecef;
      color: #333;
    }

    input[type="text"], select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #8A2BE2;
      box-shadow: 0 0 0 2px rgba(138, 43, 226, 0.2);
    }
    select { background: #fff; }

    .btn-row { display: flex; gap: 10px; align-items: center; margin-top: 25px; }
    #saveBtn { padding: 10px 20px; background-color: #8A2BE2; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; transition: background-color 0.2s; }
    #saveBtn:hover { background-color: #7A1DD2; }
    #resetBtn { padding: 10px 16px; background-color: #f1f3f5; color: #495057; border: 1px solid #ced4da; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background-color 0.2s; }
    #resetBtn:hover { background-color: #e9ecef; }
    .help-text { font-size: 12px; color: #666; margin-top: 6px; }
    #status { color: #107C10; margin-top: 12px; font-weight: bold; font-size: 14px; min-height: 20px; }
    .get-api-key-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 12px;
      margin-bottom: 10px;
      background: #ffffff;
      color: #3c4043;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      box-sizing: border-box;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .get-api-key-btn:hover {
      background: #f8f9fa;
      border-color: #8A2BE2;
      color: #8A2BE2;
      box-shadow: 0 2px 6px rgba(138, 43, 226, 0.15);
    }
  </style>
</head>
<body>
  <h1>
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    <span data-i18n="optionsTitle">KokTranslate 설정</span>
  </h1>

  <div class="form-group">
    <label for="apiKey" data-i18n="apiKeyLabel">Gemini API Key</label>
    <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="get-api-key-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" style="flex-shrink: 0;">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      <span data-i18n="getApiKeyBtn">Google 로그인하고 무료 키 발급받기 →</span>
    </a>
    <div class="input-group">
      <input type="password" id="apiKey" placeholder="AI Studio에서 발급받은 API 키 입력" data-i18n-placeholder="apiKeyPlaceholder">
      <button type="button" id="toggleApiKey" title="비밀번호 표시/숨기기" data-i18n-title="toggleApiKeyTitle">
        <svg id="eyeIconOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg id="eyeIconClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <path
            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
          </path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>
    <div style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
      <button type="button" id="testConnectionBtn" data-i18n="testConnectionBtn" style="padding: 6px 12px; font-size: 12px; cursor: pointer; border: 1px solid #ced4da; border-radius: 4px; background: #fff; color: #495057; font-weight: 500;">연결 테스트</button>
      <span id="testStatus" style="font-size: 12px;"></span>
    </div>
  </div>

  <div class="form-group">
    <label for="geminiModel" data-i18n="geminiModelLabel">Gemini 모델 (Model)</label>
    <input type="text" id="geminiModel" placeholder="gemini-3.5-flash-lite" data-i18n-placeholder="geminiModelPlaceholder">
    <p class="help-text" data-i18n="geminiModelDesc">기본값(gemini-3.5-flash-lite) 외에 사용할 모델 ID를 직접 입력할 수 있습니다.</p>
  </div>

  <div class="form-group">
    <label for="targetLanguage" data-i18n="targetLanguageLabel">최종 번역 언어 (Target Language)</label>
    <select id="targetLanguage">
      <option value="ko" data-i18n="targetLangKo">한국어 (Korean)</option>
      <option value="en" data-i18n="targetLangEn">영어 (English)</option>
      <option value="ja" data-i18n="targetLangJa">일본어 (Japanese)</option>
      <option value="zh" data-i18n="targetLangZh">중국어 (Chinese)</option>
      <option value="es" data-i18n="targetLangEs">스페인어 (Spanish)</option>
      <option value="fr" data-i18n="targetLangFr">프랑스어 (French)</option>
      <option value="de" data-i18n="targetLangDe">독일어 (German)</option>
      <option value="ru" data-i18n="targetLangRu">러시아어 (Russian)</option>
      <option value="vi" data-i18n="targetLangVi">베트남어 (Vietnamese)</option>
      <option value="hi" data-i18n="targetLangHi">힌디어 (Hindi)</option>
    </select>
    <p class="help-text" data-i18n="targetLanguageDesc">번역 결과로 출력할 목표 언어를 설정합니다.</p>
  </div>

  <div class="form-group">
    <label for="uiLanguage" data-i18n="uiLanguageLabel">UI 언어 (Language)</label>
    <select id="uiLanguage">
      <option value="auto" data-i18n="langAuto">시스템 기본값 (자동 감지)</option>
      <option value="ko" data-i18n="langKo">한국어 (Korean)</option>
      <option value="en" data-i18n="langEn">English</option>
    </select>
  </div>

  <div class="form-group">
    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 0;">
      <input type="checkbox" id="enableMarkdown" checked style="width: 17px; height: 17px; accent-color: #8A2BE2; cursor: pointer;">
      <span data-i18n="enableMarkdownLabel">마크다운 서식 뷰어 사용</span>
    </label>
    <p class="help-text" data-i18n="enableMarkdownDesc">번역 결과의 코드, 목록, 굵은 글씨 등을 마크다운 서식으로 깔끔하게 렌더링합니다.</p>
  </div>

  <div class="btn-row">
    <button type="button" id="saveBtn" data-i18n="saveBtn">저장하기</button>
    <button type="button" id="resetBtn" data-i18n="resetBtn">기본값 초기화</button>
  </div>
  <div id="status"></div>

  <div style="margin-top: 20px; padding-top: 12px; border-top: 1px solid #eee;">
    <p class="help-text" style="color: #666; margin: 0; display: flex; align-items: center; gap: 6px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #8A2BE2; flex-shrink: 0;">
        <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
        <line x1="6" y1="8" x2="6.01" y2="8"></line>
        <line x1="10" y1="8" x2="10.01" y2="8"></line>
        <line x1="14" y1="8" x2="14.01" y2="8"></line>
        <line x1="18" y1="8" x2="18.01" y2="8"></line>
        <line x1="6" y1="12" x2="6.01" y2="12"></line>
        <line x1="10" y1="12" x2="10.01" y2="12"></line>
        <line x1="14" y1="12" x2="14.01" y2="12"></line>
        <line x1="18" y1="12" x2="18.01" y2="12"></line>
        <line x1="7" y1="16" x2="17" y2="16"></line>
      </svg>
      <span data-i18n="cmdToggleTranslate">번역 모드 켜기/끄기 토글 (Ctrl+Shift+X)</span>
    </p>
  </div>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
