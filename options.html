<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>KokTranslate 설정</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
    h1 { color: #8A2BE2; font-size: 20px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; }
    .input-wrapper { display: flex; gap: 10px; }
    input[type="password"], input[type="text"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background-color: #8A2BE2; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #7A1DD2; }
    #toggleApiKey { background-color: #f0f0f0; color: #333; }
    #toggleApiKey:hover { background-color: #e0e0e0; }
    #status { color: #107C10; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h1 style="display: flex; align-items: center; gap: 8px;"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>KokTranslate 설정</h1>
  <div class="form-group">
    <label for="apiKey">Gemini API Key</label>
    <div class="input-wrapper">
      <input type="password" id="apiKey" placeholder="AI Studio에서 발급받은 API 키 입력">
      <button id="toggleApiKey">보기</button>
    </div>
    <p style="font-size: 12px; color: #666; margin-top: 5px;">기본적으로 gemini-3.1-flash-lite 모델을 사용합니다.</p>
  </div>
  <button id="saveBtn">저장하기</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
