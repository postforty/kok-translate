<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>KokTranslate 설정</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: 0 auto; }
    h1 { color: #8A2BE2; font-size: 20px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; }
    .input-wrapper { display: flex; gap: 10px; }
    input[type="password"], input[type="text"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background-color: #8A2BE2; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #7A1DD2; }
    #toggleApiKey { background-color: #f0f0f0; color: #333; }
    #toggleApiKey:hover { background-color: #e0e0e0; }
    #status { color: #107C10; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>⚙️ KokTranslate 설정</h1>
  <div class="form-group">
    <label for="apiKey">Gemini API Key</label>
    <div class="input-wrapper">
      <input type="password" id="apiKey" placeholder="AI Studio에서 발급받은 API 키 입력">
      <button id="toggleApiKey">보기</button>
    </div>
    <p style="font-size: 12px; color: #666; margin-top: 5px;">기본적으로 gemini-3.1-flash-lite 모델을 사용합니다.</p>
  </div>
  <button id="saveBtn">저장하기</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
