<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; width: 250px; padding: 15px; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    h2 { margin: 0 0 10px 0; font-size: 16px; display: flex; align-items: center; gap: 5px; color: #8A2BE2; }
    button { padding: 10px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
    #start-btn { background: #8A2BE2; color: white; }
    #start-btn:hover { background: #7A1DD2; }
    #start-btn.active { background: #D13438; }
    #start-btn.active:hover { background: #A4262C; }
    #options-btn { background: #f0f0f0; color: #333; }
    #options-btn:hover { background: #e0e0e0; }
  </style>
</head>
<body>
  <h2>🖱️ KokTranslate</h2>
  <p style="font-size: 12px; color: #666; margin: 0 0 10px 0;">번역할 요소를 직접 선택해 보세요!</p>
  <button id="start-btn">콕! 번역 모드 켜기</button>
  <button id="options-btn">설정 (API Key)</button>
  <script src="popup.js"></script>
</body>
</html>
