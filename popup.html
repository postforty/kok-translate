<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; width: 250px; padding: 15px; margin: 0; display: flex; flex-direction: column; gap: 10px; }
    h2 { margin: 0 0 10px 0; font-size: 16px; display: flex; align-items: center; gap: 5px; color: #8A2BE2; }
    button { padding: 10px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
    #start-btn { background: #8A2BE2; color: white; }
    #start-btn:hover { background: #7A1DD2; }
    #start-btn.active { background: #D13438; }
    #start-btn.active:hover { background: #A4262C; }
    #options-btn { background: #f0f0f0; color: #333; }
    #options-btn:hover { background: #e0e0e0; }
    #guide-btn { background: #4caf50; color: white; }
    #guide-btn:hover { background: #45a049; }
  </style>
</head>
<body>
  <h2><img src="logo.png" width="20" height="20" alt="logo" style="border-radius: 4px;"> KokTranslate</h2>
  <p style="font-size: 12px; color: #666; margin: 0 0 10px 0;" data-i18n="popupSubtitle">번역할 요소를 직접 선택해 보세요!</p>
  <button id="start-btn" data-i18n="startMode">콕! 번역 모드 켜기</button>
  <div style="display: flex; gap: 8px;">
    <button id="guide-btn" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg>
      <span data-i18n="guideBtn">설명서</span>
    </button>
    <button id="options-btn" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <span data-i18n="optionsBtn">설정</span>
    </button>
  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
